<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ransom Notes Online v2.1</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="tape">TOP SECRET</div><h1>RANSOM NOTES</h1><p>ONLINE CUT-OUT EDITION</p></header><section id="home" class="panel"><label>Name<input id="name" maxlength="24" autocomplete="nickname"></label><button id="create">CREATE ROOM</button><div>— OR —</div><label>Room code<input id="room" maxlength="4" autocapitalize="characters"></label><button id="join">JOIN ROOM</button><p id="error"></p></section><section id="lobby" class="panel hidden"><h2>ROOM <span id="roomLabel"></span></h2><div id="players"></div><p id="lobbyMsg"></p><label>ROUND TIME<select id="roundTime"><option value="2">2 minutes</option><option value="3">3 minutes</option><option value="4">4 minutes</option><option value="5">5 minutes</option><option value="6">6 minutes</option><option value="7">7 minutes</option><option value="8">8 minutes</option><option value="9">9 minutes</option><option value="10">10 minutes</option></select></label><button id="start">START ROUND</button><button id="copy">COPY INVITE</button><p class="small">The host chooses the round time. When time runs out, everyone’s current note is submitted automatically.</p></section><section id="game" class="hidden"><div class="gamehead"><span id="round"></span><span id="timer"></span></div><div class="prompt" id="prompt"></div><div class="scoreboard paper"><h3>SCOREBOARD</h3><div id="scoreboard"></div></div><div class="paper"><h3>YOUR 100 WORDS</h3><p class="small">Choose any of your supplied words to build your note.</p><div id="tiles" class="tiles"></div></div><div class="paper"><h3>YOUR RANSOM NOTE</h3><div id="sentence" class="sentence"></div><button id="submit">SUBMIT NOTE</button><button id="clear">CLEAR</button></div><p id="status"></p><div id="submissions" class="paper hidden"></div><div id="winner" class="winner hidden"></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js?v=210"></script></body></html>

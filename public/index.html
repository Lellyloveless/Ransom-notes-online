<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ransom Notes Online</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="tape">TOP SECRET</div><h1>RANSOM NOTES</h1><p>ONLINE CUT-OUT EDITION</p></header><section id="home" class="panel"><label>Name<input id="name" maxlength="24"></label><button id="create">CREATE ROOM</button><div>— OR —</div><label>Room code<input id="room" maxlength="4"></label><button id="join">JOIN ROOM</button><p id="error"></p></section><section id="lobby" class="panel hidden"><h2>ROOM <span id="roomLabel"></span></h2><div id="players"></div><p id="lobbyMsg"></p><button id="start">START ROUND</button><button id="copy">COPY INVITE</button></section><section id="game" class="hidden"><div class="gamehead"><span id="round"></span><span id="timer"></span></div><div id="prompt" class="prompt"></div><div class="paper"><h3>YOUR WORDS</h3><p>Choose from your 100-word bank to build your note.</p><div id="tiles" class="tiles"></div></div><div class="paper"><h3>YOUR SENTENCE</h3><div id="sentence"></div><button id="submit">SUBMIT NOTE</button><button id="clear">CLEAR</button></div><p id="status"></p><div id="submissions" class="paper hidden"></div><div id="winner" class="winner hidden"></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
